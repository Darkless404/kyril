<!DOCTYPE html>
<html lang="uk">
    <head>
        <link rel="stylesheet"href="style.css">
    </head>
<body>
    

<div class="app-container">
    <div id="start-screen" class="screen">
        <h1></h1>
        <h1> QUIZ "Anime"</h1>
        <button id='start-btn'>Start</button>

    </div>

    <div id="quiz-screen" class="screen hide">
        <div class='header'>
            <span id=timer>Чяс: 15 секунд</span>
            <span id='score-display'>Бали: 0</span>
        </div>
        <h2 id="question-text">Питання</h2>
        <div id="answers-container">
            
        </div>
    </div>

    <div id="result-screen" class="screen hide">
        <h2> Quiz пройдено на</h2>
        <p class = 'result-text'></p>
        <button id='restart-btn'>Повернутися </button>

    </div>
</div>
<script src="script.js"></script>
</body>
</html>
